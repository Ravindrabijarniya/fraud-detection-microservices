server:
  port: 8084

spring:
  application:
    name: notification-service

  security:
    oauth2:
      resourceserver:
        jwt:
          secret: my-super-secret-key-123456789012345678902

  datasource:
    url: jdbc:mysql://mysql:3306/notification_db
    username: notification_user
    password: notification123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  kafka:
    bootstrap-servers: kafka:9092

    consumer:
      group-id: notification-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

      properties:
        spring.json.trusted.packages: com.common.events
        spring.json.value.default.type: com.common.events.FraudResultEvent

kafka:
  topic:
    fraud-results: fraud-results


jwt:
  secret: my-super-secret-key-123456789012345678902

