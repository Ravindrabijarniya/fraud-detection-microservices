server:
  port: 8082

spring:
  application:
    name: transaction-service

#  security:
#    oauth2:
#      resourceserver:
#        jwt:
#          secret-key: my-super-secret-key-123456789012345678902

  datasource:
    url: jdbc:mysql://mysql:3306/transaction_db
    username: transaction_user
    password: transaction123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  sql:
    init:
      mode: never

  kafka:
    bootstrap-servers: kafka:9092
    consumer:
      group-id: transaction-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.common.events
        spring.json.value.default.type: com.common.events.FraudResultEvent

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

kafka:
  topic:
    transaction-created: transaction.created
    fraud-results: fraud-results

