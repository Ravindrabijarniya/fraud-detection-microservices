server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:

        - id: auth-service
          uri: http://auth-service:8081
          predicates:
            - Path=/auth/**

        - id: transaction-service
          uri: http://transaction-service:8082
          predicates:
            - Path=/transactions/**
          filters:
            - JwtAuthenticationFilter

        - id: notification-user
          uri: http://notification-service:8084
          predicates:
            - Path=/notifications/**
          filters:
            - JwtAuthenticationFilter

        - id: notification-admin
          uri: http://notification-service:8084
          predicates:
            - Path=/admin/notifications/**
          filters:
            - JwtAuthenticationFilter

jwt:
  secret: my-super-secret-key-123456789012345678902
